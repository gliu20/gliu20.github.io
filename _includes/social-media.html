<ul class="social-links">
    {%- for social_media in site.data.social-media %}
    <li>
        <a class="icon-btn" href="{{ social_media.link }}" title="{{ social_media.name }} @{{ social_media.username | strip }}" aria-label="{{ social_media.name }}">
            <span class="icon">
                <i class="{{ social_media.icon }} fa-lg" aria-hidden="true"></i>
            </span>
        </a>
    </li>
    {%- endfor %}
</ul>
